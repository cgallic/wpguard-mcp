name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate version and release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Match package, plugin, and tag versions
        id: version
        run: |
          python - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          plugin = Path("wp-plugin/wpguard-companion.php").read_text()
          match = re.search(r"^\s*\* Version:\s*(\S+)", plugin, re.MULTILINE)
          assert match and match[1] == version, "Plugin and package versions differ"
          module = Path("src/wpguard_mcp/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"', module, re.MULTILINE)
          assert match and match[1] == version, "Module and package versions differ"
          server = json.loads(Path("server.json").read_text())
          assert server["version"] == version, "Registry and package versions differ"
          assert server["name"] == "io.github.cgallic/wpguard-mcp", "Unexpected registry namespace"
          assert server["packages"][0]["identifier"] == f"ghcr.io/cgallic/wpguard-mcp:{version}", "OCI version differs"
          label = f'LABEL io.modelcontextprotocol.server.name="{server["name"]}"'
          assert label in Path("Dockerfile").read_text(), "OCI ownership label differs"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag and package versions differ"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Check release source
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          mypy
          php -l wp-plugin/wpguard-companion.php
          pytest -q

  docker:
    name: Build & push to GHCR
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Manual runs build both platforms and package the plugin without publishing.
      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  companion-plugin-release:
    name: Package companion plugin + create GitHub Release
    needs: [validate, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package wp-plugin as a versioned zip
        id: pkg
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          STAGE="wpguard-companion"
          mkdir -p "$STAGE"
          cp wp-plugin/wpguard-companion.php "$STAGE/"
          cp LICENSE "$STAGE/"
          ZIP="wpguard-companion-${VERSION}.zip"
          zip -r "$ZIP" "$STAGE"
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "${ZIP}.sha256"
          sha256sum --check "${ZIP}.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=${ZIP}.sha256" >> "$GITHUB_OUTPUT"

      - name: Keep package from validation runs
        uses: actions/upload-artifact@v4
        with:
          name: wpguard-companion-${{ needs.validate.outputs.version }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.checksum }}
          if-no-files-found: error

      - name: Create/update GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          body: |
            WPGuard 0.4.0 turns repeated WordPress work into a reviewable workflow. It can patch one Gutenberg block, verify the native revision created by a write, test a page on a separately registered staging site, update plugins and themes with health checks and automatic restoration, and authorize narrow unattended jobs through explicit preapproval policies.

            Companion sites can now use a dedicated WordPress Application Password. Optional WPScan intelligence returns clean, vulnerable, or unknown component status and can warn or block approval. Existing shared-key companion installations remain compatible.

            Read [SECURITY.md](https://github.com/cgallic/wpguard-mcp/blob/${{ github.ref_name }}/SECURITY.md) before connecting a site. WPGuard is built for trusted operators and keeps preview, packet, correction, snapshot, and rollback coverage explicit per tool.

            **Install:** use the attached companion ZIP (WordPress 5.6+, PHP 8.0+), or run `ghcr.io/cgallic/wpguard-mcp:${{ needs.validate.outputs.version }}` on Linux amd64 or arm64. The server and companion are separate components. See the [installation guide](https://github.com/cgallic/wpguard-mcp/blob/${{ github.ref_name }}/docs/getting-started.md).

            The attached `.sha256` file verifies the companion ZIP.
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.checksum }}

  registry-publish:
    name: Publish to the MCP Registry
    needs: [docker, companion-plugin-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install latest mcp-publisher
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher

      - name: Authenticate with GitHub Actions OIDC
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc --registry=https://registry.modelcontextprotocol.io

      - name: Publish the tagged server metadata
        run: |
          "$RUNNER_TEMP/mcp-publisher" publish server.json
